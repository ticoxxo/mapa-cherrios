name: Weekly data refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# never two refreshes at once (a manual run while the Monday one is going)
concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The first run (empty cache) downloads every source and builds the satellite composites; later runs
    # reuse the cache. Fail instead of hanging for GitHub's default 6 hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Restore the newest cache of downloaded sources; a fresh one is saved after the pipeline (even if a
      # later step fails), so the slow first-time downloads happen only once.
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache
          key: jjr-sources-${{ github.run_id }}
          restore-keys: jjr-sources-
      # Fast-changing layers only. Static ones (census, marginalization, geometry) come from the cache.
      # iNaturalist, NASA POWER, Sentinel-2 NDVI and the DENUE zip (re-downloaded when older than 6 days,
      # so a new INEGI edition is picked up the week it is published) refresh on every run.
      - name: Refresh weekly layers and write La Gaceta
        run: |
          rm -f pipeline/.cache/osm_*.json pipeline/.cache/inat_observations.json
          uv run --directory pipeline python -m hlm.run --skip blocks,streets
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
          PYTHONUNBUFFERED: "1"   # stream the pipeline's progress lines into the live log
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/.cache
          key: jjr-sources-${{ github.run_id }}
      # Someone may push to main while the pipeline runs: replay the data commit on top of the latest main.
      # On a conflicting hunk the fresh data wins (-X theirs = the commit being replayed). Retries a few times.
      - name: Commit changed data
        run: |
          git config user.name "hlm-bot"
          git config user.email "hlm-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && { echo "no data changes"; exit 0; }
          git commit -m "data: weekly refresh $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      # Publish to Cloudflare (Workers static assets, account "vinc"). Needs two repo secrets:
      # CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and deploy the site
        run: |
          npm ci
          npm run build
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
